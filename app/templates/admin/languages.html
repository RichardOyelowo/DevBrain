{% extends "layout.html" %}

{% block title %}: Admin Languages{% endblock %}

{% block body %}
<section class="app-page">
    <div class="db-page-header">
        <p class="db-eyebrow">Admin / Question bank</p>
        <h1 class="db-page-title">Languages</h1>
        <p class="db-page-subtitle">Languages power the optional code snippet filter. They are not quiz categories.</p>
    </div>

    <form method="post" class="db-panel db-p-6 form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="db-field">Name
            <input name="name" class="db-input" required>
        </label>
        <label class="db-field full">Description
            <textarea name="description" class="db-textarea"></textarea>
        </label>
        <label class="db-field check-row full">
            <input type="checkbox" name="is_active" value="1" checked>
            Active
        </label>
        <button class="db-btn db-btn--primary" name="action" value="save" type="submit">Add language</button>
    </form>

    <div class="admin-edit-list">
        {% for language in languages %}
            <form method="post" class="db-panel db-p-6 form-grid compact-edit">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="language_id" value="{{ language.id }}">
                <label class="db-field">Name
                    <input name="name" class="db-input" value="{{ language.name }}" required>
                </label>
                <label class="db-field">Slug
                    <input class="db-input" value="{{ language.slug }}" disabled>
                </label>
                <label class="db-field full">Description
                    <textarea name="description" class="db-textarea">{{ language.description }}</textarea>
                </label>
                <label class="db-field check-row">
                    <input type="checkbox" name="is_active" value="1" {% if language.is_active %}checked{% endif %}>
                    Active
                </label>
                <div class="db-btn-group">
                    <button class="db-btn db-btn--secondary" name="action" value="save" type="submit">Save</button>
                    <button class="db-btn db-btn--danger" name="action" value="delete" type="submit" onclick="return confirm('Delete this language from the filter list? Existing questions are not deleted.');">Delete</button>
                </div>
            </form>
        {% endfor %}
    </div>
</section>
{% endblock %}
