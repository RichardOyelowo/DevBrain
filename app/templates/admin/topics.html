{% extends "layout.html" %}

{% block title %}: Admin Topics{% endblock %}

{% block body %}
<section class="app-page">
    <div class="db-page-header">
        <p class="db-eyebrow">Admin / Question bank</p>
        <h1 class="db-page-title">Categories</h1>
        <p class="db-page-subtitle">Edit the topics shown on quiz setup. Languages are managed separately.</p>
    </div>

    <form method="post" class="db-panel db-p-6 form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="db-field">Name
            <input name="name" class="db-input" required>
        </label>
        <label class="db-field full">Description
            <textarea name="description" class="db-textarea"></textarea>
        </label>
        <label class="db-field full check-row">
            <input type="checkbox" name="is_active" value="1" checked>
            Active
        </label>
        <button class="db-btn db-btn--primary" name="action" value="save" type="submit">Add category</button>
    </form>

    <div class="admin-edit-list">
        {% for topic in topics %}
            <form method="post" class="db-panel db-p-6 form-grid compact-edit">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="topic_id" value="{{ topic.id }}">
                <label class="db-field">Name
                    <input name="name" class="db-input" value="{{ topic.name }}" required>
                </label>
                <label class="db-field">Slug
                    <input class="db-input" value="{{ topic.slug }}" disabled>
                </label>
                <label class="db-field full">Description
                    <textarea name="description" class="db-textarea">{{ topic.description }}</textarea>
                </label>
                <label class="db-field check-row">
                    <input type="checkbox" name="is_active" value="1" {% if topic.is_active %}checked{% endif %}>
                    Active
                </label>
                <div class="db-field">
                    <span class="db-text-secondary">{{ topic.questions|length }} questions</span>
                </div>
                <div class="db-btn-group">
                    <button class="db-btn db-btn--secondary" name="action" value="save" type="submit">Save</button>
                    <button class="db-btn db-btn--danger" name="action" value="delete" type="submit" onclick="return confirm('Delete this category? Categories with linked content will be deactivated instead.');">Delete</button>
                </div>
            </form>
        {% endfor %}
    </div>
</section>
{% endblock %}
